<text x="564" y="609" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">then code checks</text>
<text x="564" y="632" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">every draft</text>
