<text x="90" y="502.5" font-size="12.5" fill="#0a5bd6" font-weight="500" text-anchor="start">model</text>
<text x="166" y="503" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">reads, writes</text>
<rect x="76" y="520" width="78" height="24" rx="12.0" fill="#e7f6ec"/>
<text x="90" y="536.5" font-size="12.5" fill="#1f7a45" font-weight="500" text-anchor="start">code</text>
<text x="166" y="537" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">decides</text>
