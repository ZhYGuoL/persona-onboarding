<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Architecture: the browser, one brain per session on the server, and the outside services it calls">
<title>Architecture: the browser, one brain per session on the server, and the outside services it calls</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#8e8e93"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9 z" fill="#8e8e93"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#0a84ff"/></marker>
  <marker id="arrow-start-blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9 z" fill="#0a84ff"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1279" height="679" rx="24" fill="#ffffff" stroke="#e3e3e8"/>
<rect x="40" y="96" width="260" height="330" rx="22" fill="#f5f5f7"/>
<text x="60" y="122" font-size="11" fill="#8e8e93" font-weight="600" text-anchor="start" letter-spacing="0.08em">BROWSER</text>
<rect x="340" y="96" width="560" height="544" rx="22" fill="#f5f5f7"/>
<text x="360" y="122" font-size="11" fill="#8e8e93" font-weight="600" text-anchor="start" letter-spacing="0.08em">SERVER ON RAILWAY</text>
<rect x="940" y="96" width="300" height="544" rx="22" fill="#f5f5f7"/>
<text x="960" y="122" font-size="11" fill="#8e8e93" font-weight="600" text-anchor="start" letter-spacing="0.08em">OUTSIDE SERVICES</text>
<rect x="60" y="138" width="220" height="90" rx="14" fill="#ffffff" stroke="#e3e3e8" stroke-width="1"/>
<text x="76" y="164" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">Phone</text>
<text x="76" y="185" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">iMessage thread and call</text>
<text x="76" y="203" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">screens: the product itself</text>
<rect x="60" y="250" width="220" height="96" rx="14" fill="#ffffff" stroke="#e3e3e8" stroke-width="1"/>
<text x="76" y="276" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">Reviewer panel</text>
<text x="76" y="297" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">Drop, lag, deny consent,</text>
<text x="76" y="315" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">jump time, live slot ledger</text>
<rect x="360" y="138" width="230" height="90" rx="14" fill="#ffffff" stroke="#e3e3e8" stroke-width="1"/>
<text x="376" y="164" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">WebSocket and HTTP</text>
<text x="376" y="185" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">Texts, call controls, and</text>
<text x="376" y="203" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">the Google sign-in callback</text>
<rect x="360" y="250" width="230" height="96" rx="14" fill="#ffffff" stroke="#e3e3e8" stroke-width="1"/>
<text x="376" y="276" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">Hub</text>
<text x="376" y="297" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">One queue per session</text>
<text x="376" y="315" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">SQLite: state and event log</text>
<text x="376" y="333" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">Injectable clock for timers</text>
<rect x="360" y="372" width="230" height="150" rx="14" fill="#ffffff" stroke="#0a84ff" stroke-width="1.6"/>
<text x="376" y="398" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">Brain</text>
<rect x="376" y="414" width="198" height="28" rx="14.0" fill="#e8f2ff"/>
<text x="390" y="432.5" font-size="12.5" fill="#0a5bd6" font-weight="500" text-anchor="start">interpret: a model reads</text>
<rect x="376" y="448" width="198" height="28" rx="14.0" fill="#e7f6ec"/>
<text x="390" y="466.5" font-size="12.5" fill="#1f7a45" font-weight="500" text-anchor="start">decide: code decides</text>
<rect x="376" y="482" width="198" height="28" rx="14.0" fill="#e8f2ff"/>
<text x="390" y="500.5" font-size="12.5" fill="#0a5bd6" font-weight="500" text-anchor="start">render: a model writes</text>
<rect x="634" y="138" width="246" height="90" rx="14" fill="#ffffff" stroke="#e3e3e8" stroke-width="1"/>
<text x="650" y="164" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">Voice adapter</text>
<text x="650" y="185" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">Pushes what the brain learns</text>
<text x="650" y="203" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">into the live call</text>
<rect x="634" y="250" width="246" height="96" rx="14" fill="#ffffff" stroke="#e3e3e8" stroke-width="1"/>
<text x="650" y="276" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">Model client</text>
<text x="650" y="297" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">Every model call goes here,</text>
<text x="650" y="315" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">under one spend cap</text>
<rect x="634" y="372" width="246" height="150" rx="14" fill="#ffffff" stroke="#e3e3e8" stroke-width="1"/>
<text x="650" y="398" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">Task service</text>
<text x="650" y="419" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">Picks and reads the emails,</text>
<text x="650" y="437" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">then code checks the result:</text>
<text x="650" y="455" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">quote word for word, real</text>
<text x="650" y="473" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">recipient, nothing sent</text>
<text x="650" y="491" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">without a yes</text>
<rect x="634" y="552" width="246" height="72" rx="14" fill="#ffffff" stroke="#e3e3e8" stroke-width="1"/>
<text x="650" y="578" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">Google sign-in</text>
<text x="650" y="599" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">Checks which scopes came back</text>
<rect x="960" y="138" width="260" height="90" rx="14" fill="#ffffff" stroke="#e3e3e8" stroke-width="1"/>
<text x="976" y="164" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">OpenAI GPT-Live</text>
<text x="976" y="185" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">gpt-live-1, full duplex voice</text>
<rect x="960" y="250" width="260" height="96" rx="14" fill="#ffffff" stroke="#e3e3e8" stroke-width="1"/>
<text x="976" y="276" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">OpenAI text models</text>
<text x="976" y="297" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">Read messages, write replies,</text>
<text x="976" y="315" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">do the task step</text>
<rect x="960" y="372" width="260" height="150" rx="14" fill="#ffffff" stroke="#e3e3e8" stroke-width="1"/>
<text x="976" y="398" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">Gmail API</text>
<text x="976" y="419" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">Read-only</text>
<text x="976" y="437" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">or the built-in sample inbox</text>
<rect x="960" y="552" width="260" height="72" rx="14" fill="#ffffff" stroke="#e3e3e8" stroke-width="1"/>
<text x="976" y="578" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start">Google OAuth</text>
<text x="976" y="599" font-size="12.5" fill="#6e6e73" font-weight="400" text-anchor="start">Consent, in a popup</text>
