<text x="104" y="366" font-size="19.5" fill="#1d1d1f" font-weight="600" text-anchor="start">WebSocket and HTTP</text>
<text x="104" y="392" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">Texts, call controls, and</text>
<text x="104" y="415" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">the sign-in callback</text>
<rect x="399" y="323" width="260" height="122" rx="16" fill="#ffffff" stroke="#e3e3e8" stroke-width="1.2"/>
<text x="417" y="355" font-size="19.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Hub</text>
<text x="417" y="381" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">One queue per session</text>
<text x="417" y="404" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">SQLite state, event log</text>
<text x="417" y="427" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">Injectable timer clock</text>
