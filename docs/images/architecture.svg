<text x="399" y="116" font-size="19.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Reviewer panel</text>
<text x="399" y="142" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">Drop, lag, deny consent,</text>
<text x="399" y="165" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">jump time, see the ledger</text>
