<rect x="412.3" y="46.0" width="435.4" height="20.0" rx="6" fill="#ffffff"/>
<text x="630" y="60" font-size="12" fill="#0a5bd6" font-weight="500" text-anchor="middle">Call audio over WebRTC, straight between the browser and OpenAI</text>
