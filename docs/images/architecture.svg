<text x="794" y="586" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">Checks which</text>
<text x="794" y="609" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">scopes came back</text>
