<text x="104" y="560" font-size="19.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Voice adapter</text>
<text x="104" y="586" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">Pushes new facts</text>
<text x="104" y="609" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">into the live call</text>
<rect x="316" y="528" width="210" height="122" rx="16" fill="#ffffff" stroke="#e3e3e8" stroke-width="1.2"/>
<text x="334" y="560" font-size="19.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Model client</text>
<text x="334" y="586" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">Every model call,</text>
<text x="334" y="609" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">under one spend cap</text>
<rect x="546" y="528" width="210" height="122" rx="16" fill="#ffffff" stroke="#e3e3e8" stroke-width="1.2"/>
