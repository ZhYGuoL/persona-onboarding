<path d="M880 588 H960" fill="none" stroke="#8e8e93" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="898.6" y="567.0" width="42.8" height="19.0" rx="6" fill="#ffffff"/>
<text x="920" y="580" font-size="11" fill="#8e8e93" font-weight="500" text-anchor="middle">OAuth</text>
<rect x="60" y="470" width="220" height="92" rx="14" fill="#ffffff" stroke="#e3e3e8"/>
