<text x="920" y="175" font-size="11" fill="#8e8e93" font-weight="500" text-anchor="middle">sideband</text>
<path d="M880 298 H960" fill="none" stroke="#8e8e93" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="898.6" y="277.0" width="42.8" height="19.0" rx="6" fill="#ffffff"/>
<text x="920" y="290" font-size="11" fill="#8e8e93" font-weight="500" text-anchor="middle">HTTPS</text>
<path d="M880 447 H960" fill="none" stroke="#8e8e93" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
