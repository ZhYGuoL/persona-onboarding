<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="944" viewBox="0 0 1040 944" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="The onboarding flow: seven steps, an exit beside each one, and a skip ahead for a real task">
<title>The onboarding flow: seven steps, an exit beside each one, and a skip ahead for a real task</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#8e8e93"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1 L1 5 L9 9 z" fill="#8e8e93"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#0a84ff"/></marker>
  <marker id="arrow-start-blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1 L1 5 L9 9 z" fill="#0a84ff"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#30a45b"/></marker>
  <marker id="arrow-start-green" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1 L1 5 L9 9 z" fill="#30a45b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1039" height="943" rx="24" fill="#ffffff" stroke="#e3e3e8"/>
<text x="76" y="54" font-size="14" fill="#8e8e93" font-weight="700" text-anchor="start" letter-spacing="0.08em">EACH STEP</text>
<text x="512" y="54" font-size="14" fill="#8e8e93" font-weight="700" text-anchor="start" letter-spacing="0.08em">IF IT GOES ANOTHER WAY</text>
<rect x="76" y="76" width="392" height="76" rx="16" fill="#ffffff" stroke="#e3e3e8" stroke-width="1.2"/>
<text x="94" y="108" font-size="19.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Hi</text>
<text x="94" y="134" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">You text first. It shows what it does.</text>
<rect x="512" y="76" width="488" height="76" rx="16" fill="#e7f6ec"/>
<text x="530" y="108" font-size="19.5" fill="#1f7a45" font-weight="600" text-anchor="start">Name a real task at any point</text>
<text x="530" y="134" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">It skips ahead and asks only what that task needs.</text>
<path d="M468 114.0 H512" fill="none" stroke="#30a45b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="76" y="180" width="392" height="76" rx="16" fill="#ffffff" stroke="#e3e3e8" stroke-width="1.2"/>
<text x="94" y="212" font-size="19.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Its name</text>
<text x="94" y="238" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">It asks what you want to call it.</text>
<path d="M272.0 152 V180" fill="none" stroke="#8e8e93" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="512" y="180" width="488" height="76" rx="16" fill="#fff4dc"/>
<text x="530" y="212" font-size="19.5" fill="#8a5a00" font-weight="600" text-anchor="start">No name yet</text>
<text x="530" y="238" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">It goes by Persona and asks once more, later.</text>
<path d="M468 218.0 H512" fill="none" stroke="#8e8e93" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="76" y="284" width="392" height="124" rx="16" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
<text x="94" y="316" font-size="19.5" fill="#1d1d1f" font-weight="600" text-anchor="start">The call</text>
<text x="94" y="342" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">Your name, and the most annoying thing</text>
<text x="94" y="366" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">this week.</text>
<path d="M272.0 256 V284" fill="none" stroke="#8e8e93" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="512" y="284" width="488" height="124" rx="16" fill="#fff4dc"/>
<text x="530" y="316" font-size="19.5" fill="#8a5a00" font-weight="600" text-anchor="start">The call goes sideways</text>
<text x="530" y="342" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">Declined: it keeps texting.</text>
<text x="530" y="366" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">Dropped: it texts within seconds.</text>
<text x="530" y="390" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">“Gotta go”: one goodbye.</text>
<path d="M468 346.0 H512" fill="none" stroke="#8e8e93" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="76" y="436" width="392" height="76" rx="16" fill="#ffffff" stroke="#e3e3e8" stroke-width="1.2"/>
<text x="94" y="468" font-size="19.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Gmail</text>
<text x="94" y="494" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">The link lands as a banner mid-call.</text>
<path d="M272.0 408 V436" fill="none" stroke="#8e8e93" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="512" y="436" width="488" height="76" rx="16" fill="#fff4dc"/>
<text x="530" y="468" font-size="19.5" fill="#8a5a00" font-weight="600" text-anchor="start">No Gmail</text>
<text x="530" y="494" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">It asks at most twice, then lets you in anyway.</text>
<path d="M468 474.0 H512" fill="none" stroke="#8e8e93" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="76" y="540" width="392" height="100" rx="16" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
<text x="94" y="572" font-size="19.5" fill="#1d1d1f" font-weight="600" text-anchor="start">A finding</text>
<text x="94" y="598" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">It says one real thing from your inbox.</text>
<path d="M272.0 512 V540" fill="none" stroke="#8e8e93" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="512" y="540" width="488" height="100" rx="16" fill="#fff4dc"/>
<text x="530" y="572" font-size="19.5" fill="#8a5a00" font-weight="600" text-anchor="start">Nothing matches</text>
<text x="530" y="598" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">It says so first.</text>
<text x="530" y="622" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">Then it shares the most useful other find.</text>
<path d="M468 590.0 H512" fill="none" stroke="#8e8e93" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="76" y="668" width="392" height="76" rx="16" fill="#ffffff" stroke="#e3e3e8" stroke-width="1.2"/>
<text x="94" y="700" font-size="19.5" fill="#1d1d1f" font-weight="600" text-anchor="start">Recap</text>
<text x="94" y="726" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">A text of what it caught. Reply to fix.</text>
<path d="M272.0 640 V668" fill="none" stroke="#8e8e93" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="76" y="772" width="392" height="100" rx="16" fill="#ffffff" stroke="#e3e3e8" stroke-width="1.2"/>
<text x="94" y="804" font-size="19.5" fill="#1d1d1f" font-weight="600" text-anchor="start">First task</text>
<text x="94" y="830" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">A draft with a receipt from the email.</text>
<text x="94" y="854" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">It sends only on your yes.</text>
<path d="M272.0 744 V772" fill="none" stroke="#8e8e93" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="512" y="772" width="488" height="100" rx="16" fill="#fff4dc"/>
<text x="530" y="804" font-size="19.5" fill="#8a5a00" font-weight="600" text-anchor="start">Wrong or changed</text>
<text x="530" y="830" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">“Wrong email”: it starts over.</text>
<text x="530" y="854" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">“Never mind”: it drops the task.</text>
<path d="M468 822.0 H512" fill="none" stroke="#8e8e93" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M76 114.0 H58 Q44 114.0 44 128.0 V808.0 Q44 822.0 58 822.0 H76" fill="none" stroke="#30a45b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="916" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">Every exit is a row in the failure matrix, with a test.</text>
</svg>

