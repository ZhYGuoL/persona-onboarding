<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="510" viewBox="0 0 1040 510" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="How one message becomes a reply: a model reads, code decides, a model writes">
<title>How one message becomes a reply: a model reads, code decides, a model writes</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#8e8e93"/></marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1 L1 5 L9 9 z" fill="#8e8e93"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#0a84ff"/></marker>
  <marker id="arrow-start-blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1 L1 5 L9 9 z" fill="#0a84ff"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#30a45b"/></marker>
  <marker id="arrow-start-green" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1 L1 5 L9 9 z" fill="#30a45b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1039" height="509" rx="24" fill="#ffffff" stroke="#e3e3e8"/>
<text x="40" y="56" font-size="22" fill="#1d1d1f" font-weight="600" text-anchor="start">How one message becomes a reply</text>
<rect x="40" y="156" width="270" height="242" rx="16" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
<rect x="56" y="174" width="178" height="32" rx="16.0" fill="#e8f2ff"/>
<text x="72" y="195.58" font-size="15.5" fill="#0a5bd6" font-weight="600" text-anchor="start">interpret · model</text>
<text x="58" y="238" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">Turns the words into</text>
<text x="58" y="261" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">signals: a name, a need,</text>
<text x="58" y="284" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">a yes, a task, a refusal,</text>
<text x="58" y="307" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">a jailbreak attempt.</text>
<rect x="350" y="156" width="340" height="242" rx="16" fill="#ffffff" stroke="#30a45b" stroke-width="2"/>
<rect x="366" y="174" width="140" height="32" rx="16.0" fill="#e7f6ec"/>
<text x="382" y="195.58" font-size="15.5" fill="#1f7a45" font-weight="600" text-anchor="start">decide · code</text>
<text x="368" y="238" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">Applies the rules and</text>
<text x="368" y="261" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">picks the next step:</text>
<text x="368" y="284" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">• One question per turn</text>
<text x="368" y="307" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">• Never re-ask a confirmed field</text>
<text x="368" y="330" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">• At most two asks per field</text>
<text x="368" y="353" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">• Nothing sent without a yes</text>
<text x="368" y="376" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">• Starts tasks, timers, calls</text>
<rect x="730" y="156" width="270" height="242" rx="16" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
<rect x="746" y="174" width="166" height="32" rx="16.0" fill="#e8f2ff"/>
<text x="762" y="195.58" font-size="15.5" fill="#0a5bd6" font-weight="600" text-anchor="start">render · model</text>
<text x="748" y="238" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">Writes it in Persona's</text>
<text x="748" y="261" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">voice. A guard checks it:</text>
<text x="748" y="284" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">no promises, no links,</text>
<text x="748" y="307" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">one question, no repeats.</text>
<text x="748" y="330" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">If it fails twice, a</text>
<text x="748" y="353" font-size="16.5" fill="#6e6e73" font-weight="400" text-anchor="start">template goes out.</text>
<path d="M310 277.0 H350" fill="none" stroke="#8e8e93" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M690 277.0 H730" fill="none" stroke="#8e8e93" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="80" width="312" height="44" rx="22" fill="#f5f5f7"/>
<text x="60" y="108" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">A text, or a line heard on the call</text>
<path d="M175.0 124 V156" fill="none" stroke="#8e8e93" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="664" y="430" width="336" height="44" rx="22" fill="#f5f5f7"/>
<text x="684" y="458" font-size="16.5" fill="#1d1d1f" font-weight="400" text-anchor="start">Sent as a text, or said on the call</text>
<path d="M865.0 398 V430" fill="none" stroke="#8e8e93" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

